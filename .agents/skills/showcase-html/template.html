<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>__TITLE__</title>
<style>
  :root {
    --bg: #0c0d11;
    --panel: #151720;
    --panel-2: #1c1f2b;
    --panel-3: #232734;
    --border: #2a2e3c;
    --border-soft: #232636;
    --text: #eceef4;
    --muted: #9aa1b4;
    --faint: #6b7280;
    --accent: #f5a524;
    --accent-soft: rgba(245, 165, 36, 0.12);
    --accent-2: #4f8cff;
    --accent-2-soft: rgba(79, 140, 255, 0.12);
    --accent-3: #34d399;
    --accent-3-soft: rgba(52, 211, 153, 0.12);
    --radius: 14px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(12, 13, 17, 0.82);
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border-bottom: 1px solid var(--border);
  }
  nav .inner {
    max-width: 1440px; margin: 0 auto; padding: 12px 32px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  nav .brand { font-weight: 700; font-size: 14px; margin-right: 16px; color: var(--text); }
  nav .brand span { color: var(--accent); }
  nav a {
    color: var(--muted); text-decoration: none; font-size: 13.5px; font-weight: 500;
    padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel); transition: color .15s, border-color .15s, background .15s;
  }
  nav a:hover { color: var(--text); border-color: var(--accent); background: var(--panel-2); }
  header { padding: 44px 32px 20px; max-width: 1440px; margin: 0 auto; }
  header .kicker {
    text-transform: uppercase; letter-spacing: 0.14em; font-size: 12px;
    font-weight: 700; color: var(--accent); margin-bottom: 10px;
  }
  header h1 { margin: 0 0 10px; font-size: 32px; letter-spacing: -0.02em; line-height: 1.15; }
  header p.lede { margin: 0; color: var(--muted); font-size: 15.5px; max-width: 820px; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .badge {
    font-size: 12px; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel); color: var(--muted);
  }
  .badge b { color: var(--text); font-weight: 600; }
  main { max-width: 1440px; margin: 0 auto; padding: 8px 32px 72px; }
  section { margin-top: 52px; }
  .section-head {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .section-head .icon {
    width: 28px; height: 28px; border-radius: 8px; display: inline-flex;
    align-items: center; justify-content: center; font-size: 15px; align-self: center;
  }
  .section-head h2 { margin: 0; font-size: 21px; letter-spacing: -0.01em; }
  .section-head .count { color: var(--muted); font-size: 13px; }
  .section-desc { color: var(--muted); font-size: 13.5px; margin: -8px 0 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 22px; }
  .grid.media-only { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column;
    transition: border-color .18s, transform .18s, box-shadow .18s;
  }
  .card:hover { border-color: #3a3f51; transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,0.35); }
  .card.elem { border-top: 3px solid var(--accent-2); }
  .card.video { border-top: 3px solid var(--accent); }
  .card.audio { border-top: 3px solid var(--accent-3); }
  .media-frame { position: relative; background: #000; }
  .media-frame video, .media-frame img {
    width: 100%; display: block; aspect-ratio: 16 / 9; object-fit: contain; background: #000;
  }
  .media-frame img { object-fit: cover; }
  .media-frame audio { width: 100%; display: block; padding: 12px; background: var(--panel-2); }
  .media-frame .kind-pill {
    position: absolute; top: 10px; left: 10px; font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 9px; border-radius: 6px;
    background: rgba(0,0,0,0.62); color: #fff; backdrop-filter: blur(4px);
  }
  .card .body { padding: 15px 18px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .card .title { font-weight: 650; font-size: 15.5px; }
  .card .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .meta .chip {
    font-size: 11.5px; padding: 3px 9px; border-radius: 6px; background: var(--panel-3);
    border: 1px solid var(--border); color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .refs { display: flex; flex-direction: column; gap: 6px; }
  .refs .refs-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint);
  }
  .refs .ref {
    display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted);
    padding: 7px 10px; border: 1px solid var(--border-soft); border-radius: 8px; background: var(--panel-2);
  }
  .ref .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.img { background: var(--accent-2); }
  .dot.aud { background: var(--accent-3); }
  .dot.vid { background: var(--accent); }
  .ref .ref-name { color: var(--text); font-weight: 600; }
  .ref .ref-role { color: var(--faint); font-size: 11.5px; }
  .prompt-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint);
  }
  pre {
    margin: 0; padding: 13px 15px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: #c9ceda;
    max-height: 280px; overflow-y: auto;
  }
  pre::-webkit-scrollbar { width: 8px; }
  pre::-webkit-scrollbar-thumb { background: #343845; border-radius: 8px; }
  .tag {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--accent);
  }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px;
  }
  .panel video { width: 100%; display: block; border-radius: 8px; background: #000; }
  .panel .caption { margin-top: 14px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  footer {
    max-width: 1440px; margin: 0 auto; padding: 24px 32px 56px;
    color: var(--faint); font-size: 12.5px; border-top: 1px solid var(--border);
  }
  .table-wrap {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
  }
  table.showcase { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.showcase thead th {
    text-align: left; font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); background: var(--panel-2);
    border-bottom: 1px solid var(--border); padding: 13px 16px;
  }
  table.showcase th.col-stage { width: 140px; }
  table.showcase th.col-prompt { width: 44%; }
  table.showcase th.col-result { width: auto; }
  table.showcase tbody td { vertical-align: top; padding: 16px; border-bottom: 1px solid var(--border-soft); }
  table.showcase tbody tr:last-child td { border-bottom: none; }
  table.showcase .stage {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 4px 10px; border-radius: 6px; margin-bottom: 8px;
  }
  .stage.before { background: var(--accent-2-soft); color: var(--accent-2); }
  .stage.after { background: var(--accent-soft); color: var(--accent); }
  table.showcase .stage-title { font-weight: 650; font-size: 14px; margin-bottom: 4px; }
  table.showcase .stage-sub { font-size: 12px; color: var(--muted); line-height: 1.5; }
  table.showcase pre {
    margin: 0; padding: 12px 14px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: #c9ceda;
    max-height: 360px; overflow-y: auto;
  }
  table.showcase pre::-webkit-scrollbar { width: 8px; }
  table.showcase pre::-webkit-scrollbar-thumb { background: #343845; border-radius: 8px; }
  table.showcase .result-video {
    width: 100%; display: block; background: #000; border-radius: 8px; aspect-ratio: 16 / 9; object-fit: contain;
  }
  table.showcase .result-meta {
    margin-top: 8px; font-size: 12px; color: var(--faint);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
</style>
</head>
